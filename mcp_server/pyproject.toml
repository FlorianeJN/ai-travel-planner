[project]
name = "mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FlorianeJN", email = "Floriane.nikebie.1@etsmtl.net" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.1",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "python-dotenv>=1.2.3",
    "starlette>=1.6.0",
    "tavily-python>=0.8.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
mcp-server = "mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
