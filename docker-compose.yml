services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - mcp_server

  mcp_server:
    build:
      context: ./mcp_server
    ports:
      - "5000:5000" 
    env_file:
      - .env
    volumes:
      - ./mcp_server/src:/app/src